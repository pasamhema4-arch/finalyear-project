<!DOCTYPE html>
<html>

<head>

<title>Emotion Analysis</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h3>Emotion Analyzer</h3>

<textarea class="form-control" id="text" rows="4" placeholder="Write how you feel"></textarea>

<button class="btn btn-primary mt-3" onclick="analyze()">Analyze</button>

<h4 class="mt-3" id="result"></h4>

</div>

<script>

async function analyze(){

let token=localStorage.getItem("token")

let text=document.getElementById("text").value

let res=await fetch("http://127.0.0.1:5000/analysis/social",{

method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},

body:JSON.stringify({
text:text
})

})

let data=await res.json()

document.getElementById("result").innerText=
"Emotion: "+data.label+" ("+(data.score*100).toFixed(1)+"%)"

}

</script>

</body>

</html>
