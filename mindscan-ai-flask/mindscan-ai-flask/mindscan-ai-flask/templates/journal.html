<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindScan AI - Daily Journal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <nav class="navbar">
        <h2 onclick="window.location.href='/dashboard'">🧠 MindScan AI</h2>
        <div class="nav-links" id="nav-links" style="display: none;">
            <a href="/dashboard">Dashboard</a>
            <a href="/journal" class="active">Journal</a>
            <a href="/report">Reports</a>
            <a href="/chatbot">Chat</a>
            <a href="/games">Games</a>
            <a href="/settings">Settings</a>
        </div>
        <div style="display: flex; align-items: center;">
            <div class="bell-icon" id="notif-bell" onclick="toggleNotifs()">
                🔔<span class="badge" id="notif-badge" style="display:none">0</span>
                <div class="notif-dropdown" id="notif-dropdown">
                    <div id="notif-list"></div>
                </div>
            </div>
            <div class="auth-buttons" id="auth-buttons"></div>
        </div>
    </nav>

    <div class="main-content">
        <h1 class="hero-title" style="font-size: 2.5rem; text-align: left;">Daily AI Journal</h1>
        <p class="text-muted" style="margin-bottom: 2rem;">Write freely. Your entries are analyzed securely for emotional insights.</p>
        
        <div class="grid-container" style="grid-template-columns: 1fr;">
            
            <!-- Write Entry -->
            <div class="glass-card">
                <h3>New Entry</h3>
                <input type="text" id="jTitle" class="form-control" placeholder="Title (optional)" style="margin-bottom: 1rem; width: 100%; box-sizing: border-box;">
                <textarea id="jContent" placeholder="Dear journal, today I felt..." style="height: 150px;"></textarea>
                <button class="btn mt-1" id="saveBtn" onclick="saveJournal()">Save Entry</button>
                <div id="result" style="margin-top: 1rem; display:none;" class="msg-alert"></div>
            </div>

            <!-- Previoue Entries -->
            <div>
                <h3>Past Entries</h3>
                <div id="journalList" style="display: flex; flex-direction: column; gap: 1rem;">
                    <span class="spinner"></span> Loading history...
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script>
        requireAuth();

        async function loadJournals() {
            try {
                const res = await authFetch("/analysis/journal");
                if (res.ok) {
                    const data = await res.json();
                    const list = document.getElementById("journalList");
                    if (data.length === 0) {
                        list.innerHTML = `<p class="text-muted">No entries yet. Start writing!</p>`;
                        return;
                    }
                    list.innerHTML = data.map(j => `
                        <div class="glass-card">
                            <h4 style="margin: 0 0 0.5rem 0;">${j.title || 'Untitled'} 
                                <span class="badge" style="float:right; background: var(--primary); font-size: 0.8rem; padding: 2px 8px; border-radius: 12px; font-weight:normal;">AI: ${j.emotion.toUpperCase()}</span>
                            </h4>
                            <p class="text-sm text-muted mb-1">${new Date(j.date).toLocaleString()}</p>
                            <p style="white-space: pre-wrap; margin:0;" class="text-sm">${j.content}</p>
                        </div>
                    `).join("");
                }
            } catch(e) {}
        }

        async function saveJournal() {
            const btn = document.getElementById("saveBtn");
            const title = document.getElementById("jTitle").value;
            const content = document.getElementById("jContent").value;
            const resultBox = document.getElementById("result");

            if (!content.trim()) {
                showAlert("result", "Entry content cannot be empty.", "error"); return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Saving...';

            try {
                const res = await authFetch("/analysis/journal", {
                    method: "POST",
                    body: JSON.stringify({ title, content })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById("jTitle").value = '';
                    document.getElementById("jContent").value = '';
                    showAlert("result", `Saved! AI detected: ${data.emotion}`, "success");
                    loadJournals();
                } else {
                    showAlert("result", "Error saving journal", "error");
                }
            } catch (e) {
                showAlert("result", "Network error", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Save Entry';
            }
        }

        loadJournals();
    </script>
</body>
</html>
