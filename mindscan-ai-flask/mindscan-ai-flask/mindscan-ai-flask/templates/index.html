<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MindScan AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #3a0ca3, #7209b7);
    color: white;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
}

.navbar h2 {
    margin: 0;
}

.nav-links a {
    margin: 0 15px;
    color: white;
    text-decoration: none;
}

/* CARDS */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 30px;
}

.card {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

/* INPUT */
textarea {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    margin-top: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
}

/* CHAT */
.chat-box {
    height: 300px;
    overflow-y: auto;
    margin-bottom: 10px;
}

.message {
    padding: 10px;
    margin: 5px;
    border-radius: 10px;
}

.user {
    background: #4361ee;
    text-align: right;
}

.bot {
    background: #2ec4b6;
}

/* TITLE */
h3 {
    margin-top: 0;
}
</style>
</head>

<body>

<div class="navbar">
    <h2>🧠 MindScan AI</h2>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/analyse">Analyze</a>
        <a href="/report">Reports</a>
        <a href="/chatbot">Chat</a>
    </div>
</div>

<div class="container">

    <!-- Analyze -->
    <div class="card">
        <h3>Analyze Emotion</h3>
        <textarea id="textInput" placeholder="How are you feeling?"></textarea>
        <button onclick="analyze()">Analyze</button>
        <p id="result"></p>
    </div>

    <!-- Stress -->
    <div class="card">
        <h3>Stress Level</h3>
        <button onclick="getStress()">Check</button>
        <p id="stress"></p>
    </div>

    <!-- Weekly -->
    <div class="card">
        <h3>Weekly Report</h3>
        <button onclick="weekly()">Generate</button>
        <pre id="weekly"></pre>
    </div>

    <!-- Chat -->
    <div class="card">
        <h3>AI Chat</h3>
        <div class="chat-box" id="chatBox"></div>
        <input id="chatInput" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
let token = "PASTE_YOUR_JWT_TOKEN_HERE"

function analyze() {
    let text = document.getElementById("textInput").value

    fetch("/analysis/analyze", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ text })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText =
            `Emotion: ${data.emotion} | Suggestion: ${data.suggestion}`
    })
}

function getStress() {
    fetch("/analysis/stress-level", {
        headers: { "Authorization": "Bearer " + token }
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("stress").innerText =
            `${data.stress_level}`
    })
}

function weekly() {
    fetch("/analysis/weekly-report", {
        headers: { "Authorization": "Bearer " + token }
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("weekly").innerText =
            JSON.stringify(data, null, 2)
    })
}

function sendMessage() {
    let msg = document.getElementById("chatInput").value

    fetch("/analysis/chatbot", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ message: msg })
    })
    .then(res => res.json())
    .then(data => {
        let box = document.getElementById("chatBox")

        box.innerHTML += `<div class="message user">${msg}</div>`
        box.innerHTML += `<div class="message bot">${data.reply}</div>`
    })
}
</script>

</body>
</html>
