<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindScan AI - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <nav class="navbar">
        <h2>🧠 MindScan AI</h2>
        <div class="auth-buttons" id="auth-buttons">
            <a href="/register" class="btn btn-secondary">Register</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="glass-card center-form">
            <h3>Welcome Back</h3>
            <p class="text-muted text-sm" style="margin-bottom: 2rem;">Log in to track your emotional well-being.</p>
            
            <form id="loginForm" onsubmit="event.preventDefault(); login();">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn mt-1" id="loginBtn">Login</button>
                <div id="msg" class="msg-alert"></div>
            </form>
            
            <p class="mt-2 text-sm">Don't have an account? <a href="/register" style="color: var(--primary);">Sign up</a></p>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script>
        async function login() {
            const btn = document.getElementById("loginBtn");
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            
            btn.innerHTML = '<span class="spinner"></span> Logging in...';
            btn.disabled = true;
            
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                if (res.ok && data.access_token) {
                    localStorage.setItem("token", data.access_token);
                    window.location.href = "/dashboard";
                } else {
                    showAlert("msg", data.message || "Invalid credentials", "error");
                }
            } catch (error) {
                showAlert("msg", "Server connection failed.", "error");
            } finally {
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
